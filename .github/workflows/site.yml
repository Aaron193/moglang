name: Site

on:
  pull_request:
    paths:
      - ".github/workflows/site.yml"
      - "apps/site/**"
      - "tooling/vscode-mog/syntaxes/mog.tmLanguage.json"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/site.yml"
      - "apps/site/**"
      - "tooling/vscode-mog/syntaxes/mog.tmLanguage.json"
      - "package.json"
      - "package-lock.json"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm install
      - run: npm run site:check
      - run: npm run site:test
      - run: npm run site:build
