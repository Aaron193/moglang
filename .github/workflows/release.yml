name: Release Mog Runtime

on:
  push:
    tags: ["runtime/v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach to a GitHub release
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-context:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
      version: ${{ steps.version.outputs.value }}
    steps:
      - id: tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^runtime/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must have the form runtime/vX.Y.Z: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "value=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: echo "value=${RELEASE_TAG#runtime/v}" >> "$GITHUB_OUTPUT"

  validate:
    needs: release-context
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-context.outputs.tag }}
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libsdl2-dev
      - name: Verify source version matches tag
        env:
          RELEASE_VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          grep -Fq "set(MOG_VERSION \"$RELEASE_VERSION\"" CMakeLists.txt
          grep -Fq "#define MOG_RUNTIME_VERSION \"$RELEASE_VERSION\"" src/PackageManager.hpp
          grep -Fq "## $RELEASE_VERSION" CHANGELOG.md
      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMOG_VERSION=${{ needs.release-context.outputs.version }}
          cmake --build build --parallel
      - name: Verify embedded version and core regressions
        run: |
          test "$(./build/mog --version)" = "mog ${{ needs.release-context.outputs.version }} (native ABI 3)"
          ./tests/test_ast_frontend.sh
          ./tests/test_ast_emitter_regression.sh
          bash tests/test_cli_flags.sh
          bash tests/test_package_validation.sh
          bash tests/test_package_manager.sh
      - name: Editor and LSP release gates
        run: |
          bash tests/test_vscode_manifest.sh
          bash tests/test_vscode_grammar.sh
          bash tests/test_lsp_formatting.sh ./build/mog-lsp
          bash tests/test_lsp_import_diagnostics.sh ./build/mog-lsp
          bash tests/test_lsp_navigation.sh ./build/mog-lsp
          bash tests/test_lsp_protocol.sh ./build/mog-lsp
          bash tests/test_lsp_smoke.sh ./build/mog-lsp

  package:
    needs: [release-context, validate]
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-22.04
            shell: bash
            architecture: x86_64
          - name: macos-arm64
            runner: macos-latest
            shell: bash
            architecture: arm64
          - name: windows-x64
            runner: windows-2022
            shell: msys2 {0}
            architecture: x86_64
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-context.outputs.tag }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libsdl2-dev
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install openssl@3
      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python
      - name: Verify release runner architecture
        run: test "$(uname -m)" = "${{ matrix.architecture }}"
      - name: Configure
        run: >-
          cmake -S . -B build/release -DCMAKE_BUILD_TYPE=Release
          -DOPENSSL_USE_STATIC_LIBS=TRUE
          -DMOG_VERSION=${{ needs.release-context.outputs.version }}
      - name: Build
        run: cmake --build build/release --parallel
      - name: Verify embedded version
        run: >-
          test "$(./build/release/mog --version)" =
          "mog ${{ needs.release-context.outputs.version }} (native ABI 3)"
      - name: Package
        run: cpack --config build/release/CPackConfig.cmake -B dist
      - name: Validate packaged executables and dependencies
        run: |
          shopt -s nullglob
          archives=(dist/*.tar.gz dist/*.zip)
          if (( ${#archives[@]} == 0 )); then
            echo "CPack produced no runtime archives" >&2
            exit 1
          fi
          for archive in "${archives[@]}"; do
            bash scripts/validate_runtime_archive.sh "$archive" \
              "${{ needs.release-context.outputs.version }}"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mog-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  publish:
    needs: [release-context, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Refuse to replace an existing GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view '${{ needs.release-context.outputs.tag }}' >/dev/null 2>&1; then
            echo "Release already exists; published artifacts are immutable" >&2
            exit 1
          fi
      - name: Generate checksums
        run: sha256sum dist/* > dist/SHA256SUMS
      - name: Publish release assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.release-context.outputs.tag }}
          files: dist/*
