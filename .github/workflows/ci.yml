name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editor-tooling:
    name: Editor and LSP gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tooling/vscode-mog/package-lock.json
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libsdl2-dev xvfb
      - name: Build the language server that is under test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target mog-lsp --parallel
      - name: Manifest, grammar, and LSP protocol suites
        run: |
          bash tests/test_vscode_manifest.sh
          bash tests/test_vscode_grammar.sh
          bash tests/test_lsp_formatting.sh ./build/mog-lsp
          bash tests/test_lsp_import_diagnostics.sh ./build/mog-lsp
          bash tests/test_lsp_navigation.sh ./build/mog-lsp
          bash tests/test_lsp_protocol.sh ./build/mog-lsp
          bash tests/test_lsp_smoke.sh ./build/mog-lsp
      - name: Extension unit checks
        working-directory: tooling/vscode-mog
        run: |
          npm ci
          npm run compile
          npm run check
      - name: Extension Development Host integration suite
        working-directory: tooling/vscode-mog
        env:
          MOG_LSP_PATH: ${{ github.workspace }}/build/mog-lsp
        run: xvfb-run -a npm run test:extension
      - name: Package and inspect pull-request VSIX
        working-directory: tooling/vscode-mog
        run: |
          npm run compile
          mkdir -p runtime/linux-x64 ../../dist
          cp ../../build/mog-lsp runtime/linux-x64/mog-lsp
          npm run package -- --target linux-x64 --out ../../dist/vscode-mog-ci-linux-x64.vsix
          bash ../../scripts/validate_vsix.sh ../../dist/vscode-mog-ci-linux-x64.vsix linux-x64
      - name: Test packaged extension artifact
        working-directory: tooling/vscode-mog
        env:
          MOG_TEST_VSIX: ${{ github.workspace }}/dist/vscode-mog-ci-linux-x64.vsix
        run: xvfb-run -a npm run test:extension -- --vsix "$MOG_TEST_VSIX"
      - name: Upload tested VSIX
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vscode-mog-ci-linux-x64
          path: dist/vscode-mog-ci-linux-x64.vsix
          if-no-files-found: error
      - name: Upload editor test diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: editor-test-diagnostics
          path: |
            build/Testing/Temporary/**
            tooling/vscode-mog/.test-logs/**
          if-no-files-found: ignore

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: moglang/http
          ref: v0.1.0
          path: integration-packages/http
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libsdl2-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Verify embedded version
        run: ./build/mog --version
      - name: Frontend and CLI regressions
        run: |
          ./tests/test_ast_frontend.sh
          ./tests/test_ast_emitter_regression.sh
          bash tests/test_cli_flags.sh
      - name: Package validation and manager regressions
        run: |
          bash tests/test_package_validation.sh
          bash tests/test_package_manager.sh
      - name: Host API and HTTP/WebSocket integration
        run: |
          bash tests/test_host_api_v2.sh build
          bash integration-packages/http/tests/test_http_package.sh \
            ./build/interpreter ./integration-packages/http

  foundation-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: moglang/encoding
          path: foundation-packages/encoding
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: moglang/fs
          path: foundation-packages/fs
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: moglang/json
          path: foundation-packages/json
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: moglang/log
          path: foundation-packages/log
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: moglang/math
          path: foundation-packages/math
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: moglang/path
          path: foundation-packages/path
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: moglang/random
          path: foundation-packages/random
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: moglang/test
          path: foundation-packages/test
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: moglang/time
          path: foundation-packages/time
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: moglang/window
          path: foundation-packages/window
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libsdl2-dev
      - name: Build Mog runtime
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Test foundation package compatibility
        env:
          SDL_VIDEODRIVER: dummy
        run: bash tests/test_foundation_packages.sh ./build/interpreter ./foundation-packages
