name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editor-tooling:
    name: Editor and LSP gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tooling/vscode-kelvra/package-lock.json
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libsdl2-dev xvfb
      - name: Build the language server that is under test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target kelvra-lsp --parallel
      - name: Manifest, grammar, and LSP protocol suites
        run: |
          bash tests/test_vscode_manifest.sh
          bash tests/test_vscode_grammar.sh
          bash tests/test_lsp_formatting.sh ./build/kelvra-lsp
          bash tests/test_lsp_import_diagnostics.sh ./build/kelvra-lsp
          bash tests/test_lsp_navigation.sh ./build/kelvra-lsp
          bash tests/test_lsp_protocol.sh ./build/kelvra-lsp
          bash tests/test_lsp_smoke.sh ./build/kelvra-lsp
      - name: Extension unit checks
        working-directory: tooling/vscode-kelvra
        run: |
          npm ci
          npm run compile
          npm run check
      - name: Extension Development Host integration suite
        working-directory: tooling/vscode-kelvra
        env:
          KELVRA_LSP_PATH: ${{ github.workspace }}/build/kelvra-lsp
        run: xvfb-run -a npm run test:extension
      - name: Package and inspect pull-request VSIX
        working-directory: tooling/vscode-kelvra
        run: |
          npm run compile
          mkdir -p runtime/linux-x64 ../../dist
          cp ../../build/kelvra-lsp runtime/linux-x64/kelvra-lsp
          npm run package -- --target linux-x64 --out ../../dist/vscode-kelvra-ci-linux-x64.vsix
          bash ../../scripts/validate_vsix.sh ../../dist/vscode-kelvra-ci-linux-x64.vsix linux-x64
      - name: Test packaged extension artifact
        working-directory: tooling/vscode-kelvra
        env:
          KELVRA_TEST_VSIX: ${{ github.workspace }}/dist/vscode-kelvra-ci-linux-x64.vsix
        run: xvfb-run -a npm run test:extension -- --vsix "$KELVRA_TEST_VSIX"
      - name: Upload tested VSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-kelvra-ci-linux-x64
          path: dist/vscode-kelvra-ci-linux-x64.vsix
          if-no-files-found: error
      - name: Upload editor test diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: editor-test-diagnostics
          path: |
            build/Testing/Temporary/**
            tooling/vscode-kelvra/.test-logs/**
          if-no-files-found: ignore

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kelvralang/http
          ref: v0.2.0
          path: integration-packages/http
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libsdl2-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Verify embedded version
        run: ./build/kelvra --version
      - name: Frontend and CLI regressions
        run: |
          ./tests/test_ast_frontend.sh
          ./tests/test_ast_emitter_regression.sh
          bash tests/test_cli_flags.sh
      - name: Package validation and manager regressions
        run: |
          bash tests/test_package_validation.sh
          bash tests/test_package_manager.sh
      - name: Host API and HTTP/WebSocket integration
        run: |
          bash tests/test_host_api_v2.sh build
          bash integration-packages/http/tests/test_http_package.sh \
            ./build/interpreter ./integration-packages/http

  foundation-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kelvralang/encoding
          ref: v0.2.0
          path: foundation-packages/encoding
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kelvralang/fs
          ref: v0.2.0
          path: foundation-packages/fs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kelvralang/json
          ref: v0.2.0
          path: foundation-packages/json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kelvralang/log
          ref: v0.2.0
          path: foundation-packages/log
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kelvralang/math
          ref: v0.2.0
          path: foundation-packages/math
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kelvralang/path
          ref: v0.2.0
          path: foundation-packages/path
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kelvralang/random
          ref: v0.2.0
          path: foundation-packages/random
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kelvralang/test
          ref: v0.2.0
          path: foundation-packages/test
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kelvralang/time
          ref: v0.2.0
          path: foundation-packages/time
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kelvralang/window
          ref: v0.2.0
          path: foundation-packages/window
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libsdl2-dev
      - name: Build Kelvra runtime
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Test foundation package compatibility
        env:
          SDL_VIDEODRIVER: dummy
        run: bash tests/test_foundation_packages.sh ./build/interpreter ./foundation-packages
