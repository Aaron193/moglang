name: Official Packages

on:
  workflow_dispatch:

jobs:
  build-window-bundle:
    name: Build mog:window bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2 (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev

      - name: Install SDL2 (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install sdl2

      - name: Build
        run: ./build.sh --release

      - name: Validate mog:window
        run: ./build/interpreter validate-package packages/mog/window

      - name: Create publish bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail

          case "$(uname -s)" in
            Linux) os="linux" ;;
            Darwin) os="macos" ;;
            MINGW*|MSYS*|CYGWIN*) os="windows" ;;
            *) os="unknown" ;;
          esac

          case "$(uname -m)" in
            x86_64|amd64) arch="x86_64" ;;
            aarch64|arm64) arch="arm64" ;;
            i386|i686) arch="x86" ;;
            armv7l|armv6l|arm) arch="arm" ;;
            *) arch="unknown" ;;
          esac

          if [[ "$os" == "linux" ]]; then
            if command -v ldd >/dev/null 2>&1 && ldd --version 2>&1 | head -n1 | grep -qi musl; then
              target="${os}-${arch}-musl"
            else
              target="${os}-${arch}-gnu"
            fi
          else
            target="${os}-${arch}"
          fi

          bundle_dir="$GITHUB_WORKSPACE/dist/window-bundle"
          mkdir -p "$bundle_dir"
          cp packages/mog/window/mog.toml "$bundle_dir/"
          cp packages/mog/window/package.api.mog "$bundle_dir/"
          if [[ -f build/packages/mog/window/package.so ]]; then
            cp build/packages/mog/window/package.so "$bundle_dir/"
          else
            cp build/packages/mog/window/package.dylib "$bundle_dir/"
          fi
          printf '%s\n' "$target" > "$bundle_dir/publish-target.txt"
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Upload native bundle
        uses: actions/upload-artifact@v4
        with:
          name: window-bundle-${{ steps.bundle.outputs.target }}
          path: dist/window-bundle

  publish-window-registry:
    name: Publish mog:window registry
    runs-on: ubuntu-latest
    needs: build-window-bundle
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Download native bundles
        uses: actions/download-artifact@v4
        with:
          path: dist/publish-bundles

      - name: Install SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev

      - name: Build interpreter
        run: ./build.sh --release

      - name: Prepare hosted publish workspace
        id: prepare
        shell: bash
        env:
          MOG_PUBLISH_REGISTRY_INDEX: ${{ secrets.MOG_PUBLISH_REGISTRY_INDEX }}
          MOG_PUBLISH_TOKEN: ${{ secrets.MOG_PUBLISH_TOKEN }}
          MOG_PUBLISH_SIGNING_KEY: ${{ secrets.MOG_PUBLISH_SIGNING_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${MOG_PUBLISH_REGISTRY_INDEX:-}" || -z "${MOG_PUBLISH_TOKEN:-}" || -z "${MOG_PUBLISH_SIGNING_KEY:-}" ]]; then
            echo "Hosted publish secrets are not configured; skipping publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          workspace="$GITHUB_WORKSPACE/dist/publish-workspace"
          key_path="$RUNNER_TEMP/registry-key.toml"
          mkdir -p "$workspace"
          cat > "$workspace/mog.toml" <<EOF
          kind = "project"
          name = "official-package-publish"
          version = "0.1.0"
          description = "Temporary workspace for hosted official package publishing."

          [registries.release]
          index = "$MOG_PUBLISH_REGISTRY_INDEX"
EOF
          printf '%s\n' "$MOG_PUBLISH_SIGNING_KEY" > "$key_path"
          (
            cd "$workspace"
            "$GITHUB_WORKSPACE/build/interpreter" registry login release --token "$MOG_PUBLISH_TOKEN"
          )
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          echo "workspace=$workspace" >> "$GITHUB_OUTPUT"
          echo "key_path=$key_path" >> "$GITHUB_OUTPUT"

      - name: Publish bundles to hosted registry
        if: ${{ steps.prepare.outputs.should_publish == 'true' }}
        env:
          MOG_PUBLISH_BUNDLE_ROOT: ${{ github.workspace }}/dist/publish-bundles
          MOG_PUBLISH_REQUIRE_CLEAN_GIT: "true"
          MOG_PUBLISH_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          ./scripts/publish_official_window.sh \
            --registry release \
            --workspace "${{ steps.prepare.outputs.workspace }}" \
            --signing-key "${{ steps.prepare.outputs.key_path }}"
